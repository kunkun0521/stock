server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json,text/html

spring:
  application:
    name: stock
  datasource:
    url: jdbc:mysql://localhost:3306/stock_eastmoney?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: stock-pool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  sql:
    init:
      mode: always
      schema-locations: classpath:score_schema.sql

logging:
  level:
    com.li.stock: INFO

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.li.stock.domain.model,com.li.stock.domain.vo,com.li.stock.domain.query
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

# 每日定时日线抓取：00 前缀 17:00、60 前缀 18:50、30 前缀 20:20，
# 每次保证覆盖近 500 个交易日（730 个自然日），复权口径为前复权 + 不复权。
# catch-up-on-startup：启动时对今日计划时间已过的前缀自动补跑，防止应用没开/电脑睡眠错过执行。
stock:
  scheduled-crawl:
    enabled: false
    days-back: 730
    delay-millis: 1500
    catch-up-on-startup: true
    cron-00: "0 0 17 * * ?"
    cron-60: "0 50 18 * * ?"
    cron-30: "0 20 20 * * ?"
